name: Minecraft Plugin Compiler

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code ophalen van GitHub
        uses: actions/checkout@v4

      - name: Java installeren
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Purpur API downloaden
        run: |
          mkdir -p lib
          curl -L \
            "https://api.purpurmc.org/v2/purpur/1.21.11/latest/download" \
            -o lib/purpur.jar

      - name: Alle Java bestanden compileren
        run: |
          mkdir -p out
          find src/main/java -name "*.java" > sources.txt
          javac \
            -encoding UTF-8 \
            -d out \
            -cp "lib/purpur.jar" \
            @sources.txt

      - name: Plugin bestanden kopiëren
        run: |
          cp src/main/resources/plugin.yml out/

      - name: JAR maken
        run: |
          jar cf ServerCore.jar -C out .

      - name: Plugin JAR uploaden
        uses: actions/upload-artifact@v4
        with:
          name: ServerCore-Plugin
          path: ServerCore.jar
